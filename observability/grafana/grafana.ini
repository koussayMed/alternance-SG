; Grafana settings (the rest uses image defaults).
; The admin password comes from GF_SECURITY_ADMIN_PASSWORD (a secret), never from the image.

[auth.anonymous]
; Anonymous visitors are read-only: dashboards only, no explore or edit
enabled = true
org_role = Viewer

[users]
allow_sign_up = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/meteo.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
